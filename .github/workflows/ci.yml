name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, so a change on dev shows up even on days without commits.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pull requests from forks get no secrets, so their e2e tests could not reach dev and are skipped.
  FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

jobs:
  check:
    name: Typecheck, lint, format, meta-tests, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The same pinned image as the tests, so Node and npm match everywhere. meta/image.test.ts checks the tag.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high

  e2e:
    name: Playwright tests against dev (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    strategy:
      # Every shard finishes, so the merged report shows every failure, not only the first shard's.
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      DEV_BASIC_USER: ${{ secrets.DEV_BASIC_USER }}
      DEV_BASIC_PASS: ${{ secrets.DEV_BASIC_PASS }}
      FOLIO_TEST_API_TOKEN: ${{ secrets.FOLIO_TEST_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      # The job already runs in the pinned image, so `npm test` starts Playwright directly (scripts/playwright.ts).
      # Each shard writes a blob report (see playwright.config.ts), which the report job merges.
      - run: npm test -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      # No traces in CI and API errors are redacted, so this should never fire. If it does, nothing is uploaded.
      - name: Check the blob report holds no secrets
        id: scan
        if: ${{ !cancelled() }}
        run: node scripts/scan-secrets.ts blob-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  # The BDD scenarios (bdd/README.md): the feature files in bdd/features/, generated into tests by `bddgen` and run
  # with the same fixtures, projects and image as the specs. One shard; its blob report is merged with the e2e
  # shards', so there is one HTML report.
  bdd:
    name: BDD scenarios against dev
    needs: check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    env:
      DEV_BASIC_USER: ${{ secrets.DEV_BASIC_USER }}
      DEV_BASIC_PASS: ${{ secrets.DEV_BASIC_PASS }}
      FOLIO_TEST_API_TOKEN: ${{ secrets.FOLIO_TEST_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm run test:bdd
      - name: Check the blob report holds no secrets
        id: scan
        if: ${{ !cancelled() }}
        run: node scripts/scan-secrets.ts blob-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        with:
          name: blob-report-bdd
          path: blob-report/
          retention-days: 1

  # Web-vitals budgets (`@perf`), nightly and on manual runs. Alone, with one worker, so other tests don't skew the
  # timings. Its blob report is merged with the e2e shards', so the published report has the metrics.
  performance:
    name: Web-vitals budgets (nightly)
    needs: check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    env:
      DEV_BASIC_USER: ${{ secrets.DEV_BASIC_USER }}
      DEV_BASIC_PASS: ${{ secrets.DEV_BASIC_PASS }}
      FOLIO_TEST_API_TOKEN: ${{ secrets.FOLIO_TEST_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm run test:perf
      - name: Check the blob report holds no secrets
        id: scan
        if: ${{ !cancelled() }}
        run: node scripts/scan-secrets.ts blob-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        with:
          name: blob-report-performance
          path: blob-report/
          retention-days: 1

  # Burn-in: a pull request's new or changed specs and feature files, five times over in every project, with no
  # retries. A flaky test fails here, before it reaches main. A pull request that changes neither passes it without
  # running anything.
  burn-in:
    name: Burn-in of changed specs and features (×5)
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    env:
      DEV_BASIC_USER: ${{ secrets.DEV_BASIC_USER }}
      DEV_BASIC_PASS: ${{ secrets.DEV_BASIC_PASS }}
      FOLIO_TEST_API_TOKEN: ${{ secrets.FOLIO_TEST_API_TOKEN }}
      # So a changed performance spec is burned in too, in its own project.
      PERFORMANCE: 'true'
    steps:
      # A pull request's checkout is its merge commit: its first parent is the base branch, so the diff between the
      # two is exactly what the pull request changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Find the specs and feature files this pull request adds or changes
        id: specs
        run: |
          specs="$(git diff --name-only --diff-filter=d HEAD^1 HEAD -- 'tests/*.spec.ts' | tr '\n' ' ')"
          # Each feature's generated test is .features-gen/<name>.feature.spec.js; its name filters the BDD run.
          features="$(git diff --name-only --diff-filter=d HEAD^1 HEAD -- 'bdd/features/*.feature' | xargs -r -n1 basename | tr '\n' ' ')"
          echo "Changed specs: ${specs:-none}"
          echo "Changed features: ${features:-none}"
          echo "specs=$specs" >> "$GITHUB_OUTPUT"
          echo "features=$features" >> "$GITHUB_OUTPUT"
      - if: steps.specs.outputs.specs != '' || steps.specs.outputs.features != ''
        run: npm ci
      # `--retries=0`: CI's usual retries would let a flaky repeat pass on its second try.
      - if: steps.specs.outputs.specs != ''
        env:
          # Through the environment, not `${{ }}` in the script, so a file name can't inject shell code.
          SPECS: ${{ steps.specs.outputs.specs }}
          PLAYWRIGHT_HTML_OPEN: never
        # $SPECS is split into one argument per spec on purpose.
        run: npm test -- $SPECS --repeat-each=5 --retries=0 --reporter=list,github,html
      # The changed features, the same way, with their own HTML report beside the specs'.
      - if: ${{ !cancelled() && steps.specs.outputs.features != '' }}
        env:
          FEATURES: ${{ steps.specs.outputs.features }}
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: bdd-report
        # $FEATURES is split into one argument per feature on purpose.
        run: npm run test:bdd -- $FEATURES --repeat-each=5 --retries=0 --reporter=list,github,html
      - name: Check the reports hold no secrets
        id: scan
        if: ${{ !cancelled() && (steps.specs.outputs.specs != '' || steps.specs.outputs.features != '') }}
        run: node scripts/scan-secrets.ts playwright-report bdd-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        with:
          name: burn-in-report
          path: |
            playwright-report/
            bdd-report/
          retention-days: 14

  report:
    name: Merged HTML report
    needs: [e2e, bdd, performance]
    # Also after failed tests: a red run's report is the one worth reading.
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    env:
      # For the secret scan only: it looks for these values in the report.
      DEV_BASIC_USER: ${{ secrets.DEV_BASIC_USER }}
      DEV_BASIC_PASS: ${{ secrets.DEV_BASIC_PASS }}
      FOLIO_TEST_API_TOKEN: ${{ secrets.FOLIO_TEST_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: blob-reports
          merge-multiple: true
      - run: npx playwright merge-reports --config merge.config.ts blob-reports
      - name: Check the report holds no secrets
        run: node scripts/scan-secrets.ts playwright-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      # Only main's runs are published, never a pull request's.
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: playwright-report/

  pages:
    name: Publish the report to GitHub Pages
    needs: report
    if: ${{ !cancelled() && needs.report.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The one required check for pull requests: green only if every job above passed. The matrix and the skipped
  # jobs of a fork's pull request would make individual jobs awkward to require.
  ci-passed:
    name: CI passed
    needs: [check, e2e, bdd, performance, burn-in, report]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          EVENT: ${{ github.event_name }}
          CHECK: ${{ needs.check.result }}
          E2E: ${{ needs.e2e.result }}
          BDD: ${{ needs.bdd.result }}
          PERFORMANCE: ${{ needs.performance.result }}
          BURN_IN: ${{ needs.burn-in.result }}
          REPORT: ${{ needs.report.result }}
        run: |
          echo "check: $CHECK, e2e: $E2E, bdd: $BDD, performance: $PERFORMANCE, burn-in: $BURN_IN, report: $REPORT, fork pull request: $FORK_PR"
          [[ "$CHECK" == success ]] || exit 1
          if [[ "$FORK_PR" == true && "$E2E" == skipped && "$BDD" == skipped ]]; then
            echo "A fork's pull request: a maintainer runs the e2e tests before merging."
            exit 0
          fi
          [[ "$E2E" == success && "$BDD" == success && "$REPORT" == success ]] || exit 1
          # Performance runs nightly and on manual runs only; there it must pass.
          if [[ "$EVENT" == schedule || "$EVENT" == workflow_dispatch ]]; then [[ "$PERFORMANCE" == success ]] || exit 1; fi
          # Burn-in runs on pull requests only; there it must pass.
          [[ "$EVENT" != pull_request || "$BURN_IN" == success ]]
