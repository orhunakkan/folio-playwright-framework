name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, so a change on dev shows up even on days without commits.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, format, meta-tests, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The same pinned image as the tests, so Node and npm match everywhere. Its tag must match @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high

  e2e:
    name: Playwright tests against dev
    needs: check
    # Pull requests from forks get no secrets, so the tests could not reach dev. Skip them rather than fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    env:
      DEV_BASIC_USER: ${{ secrets.DEV_BASIC_USER }}
      DEV_BASIC_PASS: ${{ secrets.DEV_BASIC_PASS }}
      FOLIO_TEST_API_TOKEN: ${{ secrets.FOLIO_TEST_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npx playwright test
      # No traces in CI (see playwright.config.ts), so the report holds no secrets.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
